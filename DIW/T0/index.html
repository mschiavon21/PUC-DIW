<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neymar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .hello {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #222;
        }

        .container {
            width: 500px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .imagem {
            width: 100%;
            height: 600px;
            object-fit: cover;
            object-position: center;
            border-radius: 15px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="hello">
        Hello World!
    </div>

    <div class="container">
        <img 
            src="imagem.png" 
            alt="Neymar dando oi"
            class="imagem"
        >
    </div>

</body>
</html>
